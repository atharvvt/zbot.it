<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1216;
            --bg-card: #1a1e24;
            --bg-input: #252a31;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 30px;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        @media (max-width: 950px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--text-primary);
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 svg {
            color: var(--accent-green);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 0;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .card-title {
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title svg {
            color: var(--accent-blue);
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .btn {
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .btn-danger:hover {
            background-color: var(--accent-red);
            color: white;
        }

        /* Result card styling */
        .result-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            margin: 0;
        }

        .result-controls {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
        }

        .results-wrapper {
            flex-grow: 1;
            overflow: auto;
        }

        .no-data {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .no-data svg {
            color: var(--text-secondary);
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .results-table {
            width: 100%;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
        }

        .result-card {
            background: var(--bg-input);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .result-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid var(--border-color);
        }

        .exchange-path {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .exchange-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .exchange-from {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }

        .exchange-to {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .profit-indicator {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profit-positive {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .profit-negative {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .result-card-body {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .result-card-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .data-value {
            font-weight: 600;
            font-size: 15px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-blue {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
        }

        .badge-yellow {
            background-color: rgba(234, 179, 8, 0.15);
            color: var(--accent-yellow);
        }

        .badge-red {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .badge-green {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .badge-purple {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }

        #last-updated {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: right;
            margin-top: 15px;
        }

        /* Remove spinner arrows for number input */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

               /* Modified CSS - only showing modified styles */
               .card-title svg {
            color: var(--accent-blue);
        }

        /* Removing the buttons styling since they're not needed */
        #stopBtn {
            display: none;
        }

        /* Status indicator for showing bot status */
        .status-indicator {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 15px;
            gap: 8px;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }
        
        .status-indicator.running {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }
        
        .status-indicator.stopped {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        /* Hide the form elements we don't need */
        .checkbox-group, .btn-primary {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                Arbitrage Dashboard
            </h1>
            <p class="subtitle">Analyze and execute cryptocurrency arbitrage opportunities</p>
        </header>

        <div class="card">
            <h2 class="card-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"></path>
                </svg>
                Configuration
            </h2>
            <form id="arbForm">
                <div class="form-group">
                    <label for="pair">Exchange Pair:</label>
                    <select id="pair">
                        <!-- Binance -->
                        <option value="binance-bitget">Binance → Bitget</option>
                        <option value="binance-bitmex">Binance → BitMEX</option>
                        <option value="binance-bybit">Binance → Bybit</option>
                        <option value="binance-coinbase">Binance → Coinbase</option>
                        <option value="binance-coinex">Binance → CoinEx</option>
                        <option value="binance-crypto">Binance → Crypto.com</option>
                        <option value="binance-htx">Binance → HTX</option>
                        <option value="binance-kucoin">Binance → KuCoin</option>

                        <!-- Bitget -->
                        <option value="bitget-bitmex">Bitget → BitMEX</option>
                        <option value="bitget-crypto">Bitget → Crypto.com</option>
                        <option value="bitget-htx">Bitget → HTX</option>

                        <!-- Bybit -->
                        <option value="bybit-bitget">Bybit → Bitget</option>
                        <option value="bybit-coinbase">Bybit → Coinbase</option>
                        <option value="bybit-coinex">Bybit → CoinEx</option>
                        <option value="bybit-crypto">Bybit → Crypto.com</option>
                        <option value="bybit-htx">Bybit → HTX</option>
                        <option value="bybit-kucoin">Bybit → KuCoin</option>

                        <!-- Coinbase -->
                        <option value="coinbase-bitget">Coinbase → Bitget</option>
                        <option value="coinbase-bitmex">Coinbase → BitMEX</option>
                        <option value="coinbase-coinex">Coinbase → CoinEx</option>
                        <option value="coinbase-crypto">Coinbase → Crypto.com</option>
                        <option value="coinbase-htx">Coinbase → HTX</option>
                        <option value="coinbase-ir">Coinbase → Independent Reserve</option>
                        <option value="coinbase-kucoin">Coinbase → KuCoin</option>

                        <!-- CoinEx -->
                        <option value="coinex-bitget">CoinEx → Bitget</option>
                        <option value="coinex-bitmex">CoinEx → BitMEX</option>
                        <option value="coinex-crypto">CoinEx → Crypto.com</option>
                        <option value="coinex-htx">CoinEx → HTX</option>
                        <option value="coinex-kucoin">CoinEx → KuCoin</option>

                        <!-- KuCoin -->
                        <option value="kucoin-bitget">KuCoin → Bitget</option>
                        <option value="kucoin-crypto">KuCoin → Crypto.com</option>
                        <option value="kucoin-htx">KuCoin → HTX</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="symbol">Symbol:</label>
                    <input type="text" id="symbol" value="BTC/USDT">
                </div>

                <div class="form-group">
                    <label for="amount">Trade Amount (USD):</label>
                    <input type="number" id="amount" value="50000">
                </div>

                <button type="button" id="stopBtn" class="btn btn-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <rect x="9" y="9" width="6" height="6"></rect>
                    </svg>
                    Stop Bot
                </button>

                <div id="botStatus" class="status-indicator running">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
                    </svg>
                    Bot running every 10 seconds
                </div>
            </form>
        </div>

        <div class="card">
            <div class="result-container">
                <div class="result-header">
                    <h2 class="card-title result-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        Results
                    </h2>
                    <div class="result-controls">
                        <button class="icon-btn" id="refresh-btn" title="Refresh">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                        </button>
                        <button class="icon-btn" id="export-btn" title="Export">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="results-wrapper" id="resultsWrapper">
                    <div class="no-data" id="noDataMessage">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>Initializing arbitrage analysis...</p>
                    </div>
                    <div id="result"></div>
                </div>
                <div id="last-updated"></div>
            </div>
        </div>
    </div>

    <script>
        let intervalId = null;
        const resultContainer = document.getElementById("result");
        const noDataMessage = document.getElementById("noDataMessage");
        const lastUpdated = document.getElementById("last-updated");
        const botStatus = document.getElementById("botStatus");
        let profitHistory = [];
        let isRunning = true;

        // Function to run arbitrage analysis
        async function runArbitrage() {
            if (!isRunning) return;

            const pair = document.getElementById("pair").value;
            const symbol = document.getElementById("symbol").value;
            const trade_amount_usd = parseFloat(document.getElementById("amount").value);

            try {
                const res = await fetch(`/run/${pair}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ symbol, trade_amount_usd })
                });

                const data = await res.json();
                renderResults(data);

                // Track profits for history
                if (data.result && data.result.length > 0) {
                    const timestamp = new Date().toLocaleTimeString();
                    data.result.forEach(item => {
                        if (item.profit > 0) {
                            profitHistory.push({
                                timestamp,
                                fromExchange: item.from_exchange,
                                toExchange: item.to_exchange,
                                profit: item.profit.toFixed(2),
                                symbol: symbol
                            });
                        }
                    });
                }
            } catch (err) {
                resultContainer.innerHTML = `
                  <div class="error-message" style="background: rgba(239, 68, 68, 0.15); color: var(--accent-red); padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 8v4M12 16h.01"></path>
                      <path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18Z"></path>
                    </svg>
                    <p>Error: ${err.message}</p>
                  </div>
                `;
                noDataMessage.style.display = "none";
            }

            updateLastUpdated();
        }

        function renderResults(data) {
            if (!data.result || data.result.length === 0) {
                noDataMessage.style.display = "flex";
                resultContainer.innerHTML = `
                  <div style="background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 10px; display: block;">
                      <circle cx="12" cy="12" r="10"></circle>
                      <line x1="12" y1="8" x2="12" y2="12"></line>
                      <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p>No data available. Please check your connection or try different parameters.</p>
                  </div>
                `;
                return;
            }

            // Check if any profitable opportunities exist
            const profitableOpportunities = data.result.filter(item => item.profit > 0);

            noDataMessage.style.display = "none";
            resultContainer.innerHTML = "";

            // Add status message based on results
            if (profitableOpportunities.length > 0) {
                resultContainer.innerHTML = `
                  <div style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                      <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <p><strong>Arbitrage opportunities found!</strong> ${profitableOpportunities.length} profitable trades available.</p>
                  </div>
                `;
            } else {
                resultContainer.innerHTML = `
                  <div style="background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                      <line x1="12" y1="9" x2="12" y2="13"></line>
                      <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <p><strong>No arbitrage opportunities found.</strong> potential trade would result in losses with current market conditions.</p>
                  </div>
                `;
            }

            // Add each result card
            data.result.forEach(item => {
                const isProfitable = item.profit > 0;
                const profitClass = isProfitable ? "profit-positive" : "profit-negative";
                const profitIcon = isProfitable ?
                    '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>' :
                    '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 5-7 7 7 7"></path></svg>';

                resultContainer.innerHTML += `
                  <div class="result-card">
                    <div class="result-card-header">
                      <div class="exchange-path">
                        <span class="exchange-indicator exchange-from">${item.from_exchange}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M5 12h14"></path>
                          <path d="m12 5 7 7-7 7"></path>
                        </svg>
                        <span class="exchange-indicator exchange-to">${item.to_exchange}</span>
                      </div>
                      <div class="profit-indicator ${profitClass}">
                        ${profitIcon}
                        ${isProfitable ? 'Profit' : 'Loss'}: ${item.profit.toFixed(2)}
                      </div>
                    </div>
                    <div class="result-card-body">
                      <div class="result-card-section">
                        <div class="data-row">
                          <div class="data-label">Buy Price</div>
                          <div class="data-value">${item.buy_price.toFixed(2)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">Sell Price</div>
                          <div class="data-value">${item.sell_price.toFixed(2)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">Currency Bought</div>
                          <div class="data-value">${item.currency_bought.toFixed(6)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">After Network Fee</div>
                          <div class="data-value">${item.currency_after_network_fee.toFixed(6)}</div>
                        </div>
                      </div>
                      <div class="result-card-section">
                        <div class="data-row">
                          <div class="data-label">USD Gained</div>
                          <div class="data-value">${item.usd_gained.toFixed(2)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">Buy Fee <span class="badge badge-yellow">${item.buy_fee_usd}</span></div>
                          <div class="data-value">${item.buy_fee_usd.toFixed(2)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">Sell Fee <span class="badge badge-yellow">${item.sell_fee_usd}</span></div>
                          <div class="data-value">${item.sell_fee_usd.toFixed(2)}</div>
                        </div>
                        <div class="data-row">
                          <div class="data-label">Tax</div>
                          <div class="data-value">${item.tax.toFixed(2)}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
            });

            // Add profit history if available
            if (profitHistory.length > 0) {
                let historyHtml = `
                  <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color);">
                    <h3 style="color: var(--text-primary); font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path>
                      </svg>
                      Profit History
                    </h3>
                    <div style="max-height: 200px; overflow-y: auto; padding: 10px; background: var(--bg-input); border-radius: 8px;">
                `;

                // List last 5 profits
                const recentProfits = profitHistory.slice(-5).reverse();
                recentProfits.forEach(profit => {
                    historyHtml += `
                    <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="badge badge-green">+${profit.profit}</span>
                        <span>${profit.fromExchange} → ${profit.toExchange}</span>
                      </div>
                      <div style="color: var(--text-secondary); font-size: 14px;">${profit.timestamp}</div>
                    </div>
                  `;
                });

                historyHtml += `</div></div>`;
                resultContainer.innerHTML += historyHtml;
            }
        }

        function updateLastUpdated() {
            const now = new Date();
            lastUpdated.textContent = `Last updated: ${now.toLocaleTimeString()}`;
        }

        // Function to start the automatic arbitrage process
        function startAutomaticArbitrage() {
            if (intervalId) {
                clearInterval(intervalId);
            }
            
            // Run immediately
            runArbitrage();
            
            // Then set interval to run every 10 seconds
            intervalId = setInterval(runArbitrage, 10000);
            isRunning = true;
            
            // Update status indicator
            botStatus.classList.remove('stopped');
            botStatus.classList.add('running');
            botStatus.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
                </svg>
                Bot running every 10 seconds
            `;
        }

        // Function to stop the automatic arbitrage process
        function stopAutomaticArbitrage() {
            clearInterval(intervalId);
            intervalId = null;
            isRunning = false;
            
            // Update status indicator
            botStatus.classList.remove('running');
            botStatus.classList.add('stopped');
            botStatus.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <rect x="9" y="9" width="6" height="6"></rect>
                </svg>
                Bot stopped at ${new Date().toLocaleTimeString()}
            `;
        }

        // Event handlers
        document.getElementById("pair").addEventListener("change", function() {
            // When exchange pair changes, restart the arbitrage process
            startAutomaticArbitrage();
        });

        document.getElementById("stopBtn").addEventListener("click", function() {
            stopAutomaticArbitrage();
        });

        document.getElementById("refresh-btn").addEventListener("click", function() {
            if (!isRunning) {
                // If bot is stopped, just run once
                runArbitrage();
            }
        });

        document.getElementById("export-btn").addEventListener("click", function() {
            // Create CSV content from profit history
            if (profitHistory.length === 0) {
                alert("No profit history to export!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Timestamp,From Exchange,To Exchange,Symbol,Profit\n";

            profitHistory.forEach(profit => {
                csvContent += `${profit.timestamp},${profit.fromExchange},${profit.toExchange},${profit.symbol},${profit.profit}\n`;
            });

            // Create download link
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `arbitrage_profits_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);

            // Download the CSV file
            link.click();
            document.body.removeChild(link);
        });

        // Start automatic arbitrage as soon as the page loads
        window.addEventListener("load", function() {
            startAutomaticArbitrage();
        });
    </script>
</body>

</html>
