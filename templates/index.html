<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arbitrage Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1216;
            --bg-card: #1a1e24;
            --bg-input: #252a31;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --card-bg: #1a0538;
            --card-border: #3b095c;
            --primary-gradient: linear-gradient(135deg, #3b095c, #7b16bd);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            background: var(--primary-gradient);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--text-primary);
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 svg {
            color: var(--accent-green);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 0;
        }

        .controls {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background-color: var(--accent-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #2563eb;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            margin-right: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card:last-child {
            margin-right: 0;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .positive {
            color: var(--accent-green);
        }

        .negative {
            color: var(--accent-red);
        }

        .opportunities-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .opportunities-title {
            font-size: 1.5rem;
            color: var(--accent-purple);
            margin: 0;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Additional styles to enhance the arbitrage dashboard */

        /* Responsive grid adjustments */
        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Card hover effect */
        .opportunity-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .opportunity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        /* Card highlight effect for profitable opportunities */
        .opportunity-card.profitable {
            border-left: 4px solid var(--accent-green);
        }

        .opportunity-card.not-profitable {
            border-left: 4px solid var(--accent-red);
        }

        /* Improved price formatting */
        .price-value {
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
        }

        /* Better alert notifications */
        .alert-message {
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.5s ease;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .alert-warning {
            background: rgba(234, 179, 8, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Animation for when new cards are added */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .opportunity-card {
            animation: fadeIn 0.3s ease;
        }

        /* Improved loading spinner */
        .loading {
            text-align: center;
            padding: 40px;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile responsiveness improvements */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }

            .stats {
                flex-wrap: wrap;
            }

            .stat-card {
                flex: 1 1 45%;
                margin-right: 0;
                margin-bottom: 15px;
            }

            .opportunities-grid {
                grid-template-columns: 1fr;
            }
        }

        .pair-symbol {
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .opportunity-route {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .profit-percentage {
            position: absolute;
            top: 20px;
            right: 20px;
            font-weight: bold;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .price-label {
            color: var(--text-secondary);
        }

        .price-value {
            font-weight: 600;
        }

        .difference-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fees-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: var(--accent-red);
        }

        .profit-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Remove spinner arrows for number input */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .no-opportunities {
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                Crypto Arbitrage Dashboard
            </h1>
            <p class="subtitle">Find and analyze crypto arbitrage opportunities across exchanges</p>
        </header>

        <div class="controls">
            <div class="form-group">
                <label for="symbol">Trading Symbol:</label>
                <input type="text" id="symbol" value="BTC/USDT" placeholder="Enter symbol (e.g. BTC/USDT)">
            </div>
            <div class="form-group">
                <label for="amount">Trade Amount (USD):</label>
                <input type="number" id="amount" value="50000" placeholder="Enter trade amount">
            </div>
            <button id="analyze-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Analyze All Pairs
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Active Pairs</div>
                <div class="stat-value" id="active-pairs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Profitable Opportunities</div>
                <div class="stat-value positive" id="profitable-ops">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Max Profit Potential</div>
                <div class="stat-value positive" id="max-profit">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Update Frequency</div>
                <div class="stat-value" id="update-frequency">30s</div>
            </div>
        </div>

        <div class="opportunities-header">
            <h2 class="opportunities-title">Opportunities</h2>
            <div class="last-updated" id="last-updated">(Last updated: calculating...)</div>
        </div>

        <div id="opportunities-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Analyzing all exchange pairs...</p>
            </div>
        </div>
    </div>

    <script>
        // List of all trading pairs from your FastAPI endpoints
        const allTradingPairs = [
            "binance-bitget", "binance-bitmex", "binance-bybit", "binance-coinbase", "binance-coinex",
            "binance-crypto", "binance-htx", "binance-kucoin", "bitget-bitmex", "bitget-crypto",
            "bitget-htx", "bybit-bitget", "bybit-coinbase", "bybit-coinex", "bybit-crypto",
            "bybit-htx", "bybit-kucoin", "coinbase-bitget", "coinbase-bitmex", "coinbase-coinex",
            "coinbase-crypto", "coinbase-htx", "coinbase-kucoin", "coinex-bitget",
            "coinex-bitmex", "coinex-crypto", "coinex-htx", "coinex-kucoin", "kucoin-bitget",
            "kucoin-crypto", "kucoin-htx"
        ];

        // API base URL - change this to your FastAPI server URL
        const API_BASE_URL = 'http://localhost:8000';

        let timer;
        let opportunities = [];

        function capitalizeFirstLetter(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }

        async function fetchArbitrageData(pair, symbol, amount) {
            try {
                // Calling the actual API endpoints
                const response = await fetch(`/run/${pair}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        symbol: symbol,
                        trade_amount_usd: amount
                    }),
                });

                if (!response.ok) {
                    throw new Error(`Error fetching data for ${pair}: ${response.statusText}`);
                }

                const data = await response.json();

                // Check if data has the expected structure
                if (!data || !data.result || !Array.isArray(data.result) || data.result.length < 2) {
                    throw new Error(`Invalid data structure received for ${pair}`);
                }

                // Process both directions (from-to and to-from)
                return data.result.map((direction, index) => {
                    const [fromExchange, toExchange] = index === 0 ?
                        pair.split('-') :
                        pair.split('-').reverse();

                    return {
                        from_exchange: capitalizeFirstLetter(fromExchange),
                        to_exchange: capitalizeFirstLetter(toExchange),
                        symbol: symbol,
                        buy_price: direction.buy_price,
                        sell_price: direction.sell_price,
                        currency_bought: direction.currency_bought,
                        currency_after_network_fee: direction.currency_after_network_fee,
                        buy_fee_usd: direction.buy_fee_usd,
                        sell_fee_usd: direction.sell_fee_usd,
                        usd_gained: direction.usd_gained,
                        profit: direction.profit,
                        profit_percentage: (direction.profit / amount * 100),
                        tax: direction.tax,
                        difference: direction.sell_price - direction.buy_price,
                        fees: direction.buy_fee_usd + direction.sell_fee_usd,
                        pair_id: `${fromExchange}-${toExchange}`
                    };
                });
            } catch (error) {
                console.error(`Error fetching data for ${pair}:`, error);
                return null;
            }
        }

        async function analyzeAllPairs() {
            const symbol = document.getElementById('symbol').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (!symbol || isNaN(amount) || amount <= 0) {
                alert('Please enter a valid symbol and amount');
                return;
            }

            document.getElementById('opportunities-container').innerHTML = `
        <div class="loading" id="loading-spinner">
            <div class="spinner"></div>
            <p>Analyzing ${allTradingPairs.length} exchange pairs for ${symbol}...</p>
        </div>
    `;

            try {
                // Fetch data for all pairs simultaneously
                const promises = allTradingPairs.map(pair => fetchArbitrageData(pair, symbol, amount));
                const results = await Promise.all(promises);

                // Flatten the results and filter out nulls
                opportunities = results
                    .filter(result => result !== null)
                    .flat()
                    .sort((a, b) => b.profit - a.profit);

                renderOpportunities();
                updateStats();

                // Update timestamp
                const now = new Date();
                document.getElementById('last-updated').textContent = `(Last updated: ${now.toLocaleTimeString()})`;
            } catch (error) {
                document.getElementById('opportunities-container').innerHTML = `
            <div class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p>Error fetching data: ${error.message}. Make sure your FastAPI server is running at ${API_BASE_URL}</p>
            </div>
        `;
            }
        }

        function renderOpportunities() {
            const container = document.getElementById('opportunities-container');

            // Remove loading spinner if it exists
            const loadingSpinner = document.getElementById('loading-spinner');
            if (loadingSpinner) {
                loadingSpinner.remove();
            }

            if (opportunities.length === 0) {
                container.innerHTML = `
            <div class="no-opportunities">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p>No arbitrage opportunities found. Try different parameters or check again later.</p>
            </div>
        `;
                return;
            }

            // Filter profitable opportunities
            const profitableOps = opportunities.filter(op => op.profit > 0);

            // Clear previous content
            container.innerHTML = '';

            // Add appropriate message based on profitable opportunities
            if (profitableOps.length > 0) {
                container.innerHTML = `
            <div style="background: rgba(16, 185, 129, 0.15); color: var(--accent-green); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <p><strong>Arbitrage opportunities found!</strong> ${profitableOps.length} profitable trades available.</p>
            </div>
            <div class="opportunities-grid" id="opportunities-grid"></div>
        `;

                const grid = document.getElementById('opportunities-grid');

                // Add each profitable opportunity
                profitableOps.forEach(op => {
                    grid.innerHTML += createOpportunityCard(op, true);
                });
            } else {
                container.innerHTML = `
            <div style="background: rgba(234, 179, 8, 0.15); color: var(--accent-yellow); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <p><strong>No arbitrage opportunities found.</strong> All potential trades would result in losses with current market conditions.</p>
            </div>
            <div class="opportunities-grid" id="opportunities-grid"></div>
        `;

                // Show top 6 opportunities even if they're not profitable
                const topOps = opportunities.slice(0, 6);
                const grid = document.getElementById('opportunities-grid');

                topOps.forEach(op => {
                    grid.innerHTML += createOpportunityCard(op, false);
                });
            }
        }

        function createOpportunityCard(op, isProfitable) {
            const profitColor = isProfitable ? 'var(--accent-green)' : 'var(--accent-red)';
            const percentageColor = isProfitable ? 'var(--accent-green)' : 'var(--accent-red)';
            const percentagePrefix = isProfitable ? '+' : '';
            const percentageFormatted = op.profit_percentage.toFixed(2);
            const differenceFormatted = op.difference.toFixed(2);
            const profitFormatted = op.profit.toFixed(2);
            const feesFormatted = op.fees.toFixed(2);

            return `
        <div class="opportunity-card" data-pair="${op.pair_id}">
            <div class="pair-symbol">${op.symbol}</div>
            <div class="profit-percentage" style="color: ${percentageColor};">${percentagePrefix}${percentageFormatted}%</div>
            <div class="opportunity-header">
                <div class="opportunity-route">${op.from_exchange} → ${op.to_exchange}</div>
            </div>
            <div class="price-row">
                <span class="price-label">Buy Price:</span>
                <span class="price-value">$${op.buy_price.toFixed(2)}</span>
            </div>
            <div class="price-row">
                <span class="price-label">Sell Price:</span>
                <span class="price-value">$${op.sell_price.toFixed(2)}</span>
            </div>
            <div class="difference-row" style="color: ${op.difference > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">
                <span class="price-label">Difference:</span>
                <span class="price-value">$${differenceFormatted}</span>
            </div>
            <div class="fees-row">
                <span class="price-label">Fees:</span>
                <span class="price-value">$${feesFormatted}</span>
            </div>
            <div class="profit-row">
                <span>${isProfitable ? 'Potential Profit' : 'Result'}:</span>
                <span style="color: ${profitColor}">$${profitFormatted}</span>
            </div>
        </div>
    `;
        }

        function updateStats() {
            const profitableOps = opportunities.filter(op => op.profit > 0);
            const maxProfit = profitableOps.length > 0 ?
                Math.max(...profitableOps.map(op => op.profit)) : 0;

            document.getElementById('active-pairs').textContent = allTradingPairs.length * 2; // Each pair has two directions
            document.getElementById('profitable-ops').textContent = profitableOps.length;
            document.getElementById('max-profit').textContent = `$${maxProfit.toFixed(2)}`;
        }

        function startAutoRefresh() {
            // Clear existing timer if any
            if (timer) {
                clearInterval(timer);
            }

            // Set new timer to refresh every 30 seconds
            timer = setInterval(analyzeAllPairs, 30000);
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Initial analysis
            analyzeAllPairs();

            // Start auto-refresh
            startAutoRefresh();

            // Button click handler
            document.getElementById('analyze-btn').addEventListener('click', function () {
                analyzeAllPairs();
                startAutoRefresh(); // Reset the timer
            });
        });
    </script>
</body>

</html>
