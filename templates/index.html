<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arbitrage Finder</title>
    <style>
        :root {
            --bg-dark: #0f1216;
            --bg-card: #1a1e24;
            --bg-input: #252a31;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --card-bg: #1a0538;
            --card-border: #3b095c;
            --primary-gradient: linear-gradient(135deg, #3b095c, #7b16bd);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top section with controls and stats side by side */
        .top-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .controls {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            flex: 1;
        }

        .stats {
            flex: 1;
        }

        .form-group {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .positive {
            color: var(--accent-green);
        }

        .negative {
            color: var(--accent-red);
        }

        /* Analysis Status */
        #analysis-status-container {
            background: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .chain-table {
            width: 100%;
            border-collapse: collapse;
        }

        .chain-table th,
        .chain-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .chain-table th {
            background-color: #1f2937;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .chain-table tr:last-child td {
            border-bottom: none;
        }

        .online-badge {
            background-color: var(--accent-green);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }

        /* Opportunities section */
        .opportunities-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .opportunities-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
        }

        .nowrap {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            display: block;
            width: 100%;
            margin: 0 auto;
        }

        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .opportunity-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeIn 0.3s ease;
        }

        .opportunity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .opportunity-card.profitable {
            border-left: 4px solid var(--accent-green);
        }

        .pair-symbol {
            font-weight: bold;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .opportunity-route {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .profit-percentage {
            position: absolute;
            top: 20px;
            right: 20px;
            font-weight: bold;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .price-label {
            color: var(--text-secondary);
        }

        .price-value {
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
        }

        .difference-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fees-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: var(--accent-red);
        }

        .profit-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .no-opportunities {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .alert-message {
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.5s ease;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .page-button {
            padding: 8px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-button:hover {
            background-color: var(--accent-blue);
        }

        .page-info {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .top-section {
                flex-direction: column;
            }

            .opportunities-grid {
                grid-template-columns: 1fr;
            }
        }

        #analysis-status-container {
            max-height: 300px;
            /* Adjust height as needed */
            overflow-y: auto;
            border-radius: 8px;
        }

        /* Optional: Sticky table headers */
        .chain-table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-section">
            <div class="controls">
                <div class="form-group">
                    <label for="amount">Trade Amount (USD):</label>
                    <input type="number" id="amount" value="50000" placeholder="Enter trade amount">
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Profitable Opportunities</div>
                    <div class="stat-value positive" id="total-profit">$0.00</div>
                </div>
            </div>
        </div>

        <!-- Analysis Status Section -->
        <div id="analysis-status-container">
            <table class="chain-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Price</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="chain-status-body">
                    <!-- Dynamic content will be inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Opportunities Section -->
        <div class="opportunities-section">
            <div class="opportunities-header">
                <div class="last-updated nowrap" id="last-updated">(Last updated: calculating...)</div>
            </div>

            <div id="opportunities-container">
                <div class="no-opportunities" id="no-opportunities-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p>Hold tight! We're evaluating real-time arbitrage opportunities for you.</p>
                </div>
                <div id="opportunities-alert" class="alert-message" style="display: none;"></div>
                <div class="pagination-controls" id="opportunity-pagination" style="display: none;">
                    <button class="page-button" id="prev-page">Previous</button>
                    <span class="page-info">Page <span id="current-page">1</span> of <span
                            id="total-pages">1</span></span>
                    <button class="page-button" id="next-page">Next</button>
                </div>
                <div class="opportunities-grid" id="opportunities-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // List of all trading pairs from your FastAPI endpoints
        const allTradingPairs = [
            "binance-bitget", "bybit-coinex", "bybit-crypto", "bybit-htx",
            "coinex-bitget", "bitget-htx"
        ];

        // List of all symbols to trade automatically
        const allSymbols = [
            "BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT", "ADA/USDT", "DOGE/USDT", "DOT/USDT",
            "AVAX/USDT", "TRX/USDT", "SHIB/USDT", "LTC/USDT", "LINK/USDT", "BCH/USDT",
            "ATOM/USDT", "XLM/USDT", "NEAR/USDT", "APT/USDT", "ARB/USDT", "OP/USDT", "ETC/USDT", "HBAR/USDT",
            "FIL/USDT", "INJ/USDT", "IMX/USDT", "SUI/USDT", "PEPE/USDT", "TIA/USDT",
            "FLOW/USDT", "GRT/USDT", "LDO/USDT", "EGLD/USDT", "KAVA/USDT", "CRV/USDT", "1INCH/USDT", "ALGO/USDT", "SAND/USDT", "MANA/USDT", "CHZ/USDT", "AAVE/USDT",
            "UNI/USDT", "DYDX/USDT", "COMP/USDT", "RUNE/USDT", "ZIL/USDT"
        ];

        // API base URL - change this to your FastAPI server URL
        const API_BASE_URL = 'http://localhost:8000';

        // Pagination settings
        const itemsPerPage = 12;
        let currentPage = 1;
        let totalPages = 1;

        // Other variables
        let timer;
        let opportunities = [];
        let allOpportunities = [];
        let savedOpportunities = [];
        let currentSymbolIndex = 0;
        let isAnalyzing = false;
        let symbolPriceMap = {}; // To store buy prices by symbol for chain status table

        function capitalizeFirstLetter(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }

        async function fetchArbitrageData(pair, symbol, amount) {
            try {
                // Calling the actual API endpoints
                const response = await fetch(`/run/${pair}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        symbol: symbol,
                        trade_amount_usd: amount
                    }),
                });

                if (!response.ok) {
                    throw new Error(`Error fetching data for ${pair}: ${response.statusText}`);
                }

                const data = await response.json();

                // Check if data has the expected structure
                if (!data || !data.result || !Array.isArray(data.result) || data.result.length < 2) {
                    throw new Error(`Invalid data structure received for ${pair}`);
                }

                // Store the buy price in symbolPriceMap for updating the chain table
                if (data.result[0].buy_price) {
                    symbolPriceMap[symbol] = data.result[0].buy_price;
                }

                // Process both directions (from-to and to-from)
                return data.result.map((direction, index) => {
                    const [fromExchange, toExchange] = index === 0 ?
                        pair.split('-') :
                        pair.split('-').reverse();

                    const tokensBought = direction.currency_bought || (amount / direction.buy_price);
                    const tokensAfterFees = direction.currency_after_network_fee || tokensBought;

                    return {
                        from_exchange: capitalizeFirstLetter(fromExchange),
                        to_exchange: capitalizeFirstLetter(toExchange),
                        symbol: symbol,
                        buy_price: direction.buy_price,
                        sell_price: direction.sell_price,
                        currency_bought: tokensBought,
                        currency_after_network_fee: tokensAfterFees,
                        buy_fee_usd: direction.buy_fee_usd,
                        sell_fee_usd: direction.sell_fee_usd,
                        usd_gained: direction.usd_gained,
                        profit: direction.profit,
                        profit_percentage: (direction.profit / amount * 100),
                        tax: direction.tax,
                        difference: direction.sell_price - direction.buy_price,
                        fees: direction.buy_fee_usd + direction.sell_fee_usd,
                        pair_id: `${fromExchange}-${toExchange}`,
                        timestamp: new Date().toISOString()
                    };
                });
            } catch (error) {
                console.error(`Error fetching data for ${pair}:`, error);
                return null;
            }
        }

        // Function to populate the chain status table with dynamic symbol data
        function populateChainStatus() {
            const tableBody = document.getElementById('chain-status-body');
            tableBody.innerHTML = '';

            // Sort symbols to make display consistent
            const displaySymbols = Object.keys(symbolPriceMap).sort();

            // Display symbols with their prices
            displaySymbols.forEach(symbol => {
                const row = document.createElement('tr');
                row.innerHTML = `
            <td>${symbol}</td>
            <td>$${symbolPriceMap[symbol].toFixed(6)}</td>
            <td><span class="online-badge">Online</span></td>
        `;
                tableBody.appendChild(row);
            });

            // If we don't have any data yet, show some loading placeholders
            if (displaySymbols.length === 0) {
                for (let i = 0; i < 5; i++) {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                <td>Loading...</td>
                <td>$0.000000</td>
                <td><span class="online-badge">Online</span></td>
            `;
                    tableBody.appendChild(row);
                }
            }
        }

        async function analyzeSymbol(symbol) {
            const amount = parseFloat(document.getElementById('amount').value);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                // Fetch data for all pairs simultaneously
                const promises = allTradingPairs.map(pair => fetchArbitrageData(pair, symbol, amount));
                const results = await Promise.all(promises);

                // Update chain status table with latest price data
                populateChainStatus();

                // Flatten the results and filter out nulls
                allOpportunities = results
                    .filter(result => result !== null)
                    .flat()
                    .sort((a, b) => b.profit - a.profit);

                // Only show profitable opportunities
                opportunities = allOpportunities.filter(op => op.profit > 0);

                // Store profitable opportunities for persistent display
                if (opportunities.length > 0) {
                    // Compare with existing saved opportunities and avoid duplicates
                    opportunities.forEach(op => {
                        const exists = savedOpportunities.some(
                            saved => saved.pair_id === op.pair_id &&
                                saved.symbol === op.symbol &&
                                Math.abs(saved.profit - op.profit) < 0.01
                        );

                        if (!exists) {
                            savedOpportunities.push(op);
                        }
                    });

                    // Sort by profit descending
                    savedOpportunities.sort((a, b) => b.profit - a.profit);
                }

                // Reset to first page when new data is loaded
                currentPage = 1;
                totalPages = Math.ceil(savedOpportunities.length / itemsPerPage);

                renderOpportunities();
                updateStats();

                // Update timestamp
                const now = new Date();
                document.getElementById('last-updated').textContent = `(Last updated: ${now.toLocaleTimeString()})`;

                // Move to next symbol
                currentSymbolIndex = (currentSymbolIndex + 1) % allSymbols.length;
            } catch (error) {
                document.getElementById('opportunities-alert').innerHTML = `
            <div class="error-message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p>Error fetching data: ${error.message}. Make sure your FastAPI server is running at ${API_BASE_URL}</p>
            </div>
        `;
                document.getElementById('opportunities-alert').style.display = 'block';
            }
        }

        async function analyzeAllPairs() {
            if (isAnalyzing) return;
            isAnalyzing = true;

            try {
                // Cycle through all symbols
                for (let i = 0; i < allSymbols.length; i++) {
                    await analyzeSymbol(allSymbols[currentSymbolIndex]);
                    // Small delay between symbol analyses to avoid overwhelming the server
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            } catch (error) {
                console.error("Error in analyzeAllPairs:", error);
            } finally {
                isAnalyzing = false;
            }
        }

        function renderOpportunities() {
            // Hide the no opportunities message if we have opportunities
            document.getElementById('no-opportunities-message').style.display =
                savedOpportunities.length === 0 ? 'block' : 'none';

            // Show pagination if we have opportunities
            document.getElementById('opportunity-pagination').style.display =
                savedOpportunities.length === 0 ? 'none' : 'flex';

            if (savedOpportunities.length === 0) {
                return;
            }

            // Clear previous content in the grid
            const grid = document.getElementById('opportunities-grid');
            grid.innerHTML = '';

            // Calculate which items to show on current page
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, savedOpportunities.length);
            const paginatedItems = savedOpportunities.slice(startIndex, endIndex);

            // Add each profitable opportunity for current page
            paginatedItems.forEach(op => {
                grid.innerHTML += createOpportunityCard(op);
            });

            // Update pagination info
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = Math.ceil(savedOpportunities.length / itemsPerPage);
        }

        function createOpportunityCard(op) {
            const percentageFormatted = op.profit_percentage.toFixed(2);
            const differenceFormatted = op.difference.toFixed(2);
            const profitFormatted = op.profit.toFixed(2);
            const feesFormatted = op.fees.toFixed(2);

            return `
        <div class="opportunity-card profitable" data-pair="${op.pair_id}">
            <div class="pair-symbol">${op.symbol}</div>
            <div class="profit-percentage" style="color: var(--accent-green);">+${percentageFormatted}%</div>
            <div class="opportunity-header">
                <div class="opportunity-route">${op.from_exchange} → ${op.to_exchange}</div>
            </div>
            <div class="price-row">
                <span class="price-label">Buy Price:</span>
                <span class="price-value">$${op.buy_price.toFixed(2)}</span>
            </div>
            <div class="price-row">
                <span class="price-label">Tokens Bought:</span>
                <span class="price-value">${op.currency_bought} ${op.symbol}</span>
            </div>
            <div class="price-row">
                <span class="price-label">Sell Price:</span>
                <span class="price-value">$${op.sell_price.toFixed(2)}</span>
            </div>
            <div class="difference-row" style="color: ${op.difference > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">
                <span class="price-label">Difference:</span>
                <span class="price-value">$${differenceFormatted}</span>
            </div>
            <div class="fees-row">
                <span class="price-label">Fees:</span>
                <span class="price-value">$${feesFormatted}</span>
            </div>
            <div class="profit-row">
                <span>Profit:</span>
                <span style="color: var(--accent-green)">$${profitFormatted}</span>
            </div>
        </div>
    `;
        }

        function updateStats() {
            const totalProfit = savedOpportunities.reduce((sum, op) => sum + op.profit, 0);
            document.getElementById('total-profit').textContent = `$${totalProfit.toFixed(2)}`;
        }

        function startAutoRefresh() {
            // Clear existing timer if any
            if (timer) {
                clearInterval(timer);
            }

            // Set new timer to refresh every 60 seconds
            timer = setInterval(analyzeAllPairs, 60000);
        }

        // Initialization when the document is ready
        document.addEventListener('DOMContentLoaded', function () {
            // Populate chain status table
            populateChainStatus();

            // Set up pagination
            document.getElementById('prev-page').addEventListener('click', function () {
                if (currentPage > 1) {
                    currentPage--;
                    renderOpportunities();
                }
            });

            document.getElementById('next-page').addEventListener('click', function () {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderOpportunities();
                }
            });

            // Initial analysis
            analyzeAllPairs();

            // Start auto-refresh
            startAutoRefresh();
        });
    </script>
</body>

</html>
